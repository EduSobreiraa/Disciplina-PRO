name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-docs.mjs'
      - 'package.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-docs.mjs'
      - 'package.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm run docs:check
