name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: disciplina_pro_test
          POSTGRES_USER: disciplina_pro
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U disciplina_pro -d disciplina_pro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://disciplina_pro:test_password@localhost:5432/disciplina_pro_test
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Install Playwright browsers
        run: npm exec --workspace frontend -- playwright install --with-deps chromium firefox webkit
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:e2e
      - run: npm run test:integration
      - name: Firefox and WebKit compatibility
        run: npm run test:e2e:compatibility --workspace frontend -- --project=desktop-firefox --project=desktop-webkit --project=mobile-webkit
      - run: npm run build
      - run: npm run audit:dependencies
      - name: SonarQube Cloud scan
        # Tag v7 resolved and reviewed on 20/07/2026; Renovate/maintenance must update this SHA deliberately.
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
